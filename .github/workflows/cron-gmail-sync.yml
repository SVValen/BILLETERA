name: Cron Gmail Sync

on:
  schedule:
    - cron: '17 * * * *'  # cada hora en un minuto raro: GitHub posterga menos que cada 20 min
  workflow_dispatch:
    inputs:
      desde:
        description: 'Releer mails desde esta fecha (YYYY-MM-DD). Vacío = corrida normal'
        required: false
        default: ''

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Leer mails de Santander y Naranja y registrar gastos
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://billetera-gamma.vercel.app/api/cron?job=gmail_sync&desde=${{ github.event.inputs.desde }}")
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Error: endpoint returned $HTTP_CODE"
            exit 1
          fi
